databases:
  - name: psq-db
    plan: free

services:
  - type: web
    name: psq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: psq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # you'll fill this in after the frontend is deployed

  - type: static
    name: psq-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # fill this in with your backend URL after it deploys
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
